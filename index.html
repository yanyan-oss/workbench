<title>工作台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#B4552D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* 轻3D · 纸感台账：柔和阴影 + 层次浮起 + 中文排版（CJK 行高/字间距规则） */
  :root{
    --bg:#F1EEE6;
    --surface:#FCFBF7;
    --surface-2:#EFECE2;
    --ink:#232019;
    --muted:#6E685A;
    --faint:#A8A190;
    --line:rgba(35,32,25,.10);
    --line-strong:rgba(35,32,25,.18);
    --accent:#B4552D;
    --accent-ink:#fff;
    --accent-soft:rgba(180,85,45,.10);
    --done:#8C8574;
    --chip:#EDE9DD;
    --chip-ink:#4C4638;
    --sh1:0 1px 2px rgba(35,32,25,.06),0 4px 14px rgba(35,32,25,.07);
    --sh2:0 2px 4px rgba(35,32,25,.08),0 10px 28px rgba(35,32,25,.12);
    --font-b:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
    --font-d:var(--font-b);
    --font-m:ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171613; --surface:#211F1B; --surface-2:#2A2822; --ink:#EDE9DE;
      --muted:#A69E8E; --faint:#6E6858; --line:rgba(237,233,222,.08); --line-strong:rgba(237,233,222,.16);
      --accent:#D97A45; --accent-ink:#1c150e; --accent-soft:rgba(217,122,69,.16); --done:#837C6C;
      --chip:#2E2B25; --chip-ink:#DDD6C4;
      --sh1:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.28);
      --sh2:0 2px 6px rgba(0,0,0,.36),0 12px 32px rgba(0,0,0,.4);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171613; --surface:#211F1B; --surface-2:#2A2822; --ink:#EDE9DE;
    --muted:#A69E8E; --faint:#6E6858; --line:rgba(237,233,222,.08); --line-strong:rgba(237,233,222,.16);
    --accent:#D97A45; --accent-ink:#1c150e; --accent-soft:rgba(217,122,69,.16); --done:#837C6C;
    --chip:#2E2B25; --chip-ink:#DDD6C4;
    --sh1:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.28);
    --sh2:0 2px 6px rgba(0,0,0,.36),0 12px 32px rgba(0,0,0,.4);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);
    font-size:clamp(15px,0.94rem+0.25vw,17px);line-height:1.7;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:22px 70px;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .app{max-width:1060px;margin-inline:auto}

  header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;gap:12px}
  .brand h1{font-family:var(--font-d);font-size:clamp(24px,1.5rem+0.8vw,30px);font-weight:800;letter-spacing:0;line-height:1.35;margin:0}
  .brand .tag{font-family:var(--font-m);font-size:12px;color:var(--muted);letter-spacing:.02em}
  .head-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .today-label{font-family:var(--font-m);font-size:13px;color:var(--muted)}
  .today-label b{color:var(--accent);font-weight:600}
  .btn{font-family:var(--font-b);font-weight:600;font-size:14px;padding:8px 15px;border-radius:12px;
    border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    box-shadow:var(--sh1);transition:transform .12s ease,box-shadow .12s ease}
  .btn:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
  .btn:active{transform:translateY(0)}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  main{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
  @media (max-width:800px){ main{grid-template-columns:1fr} }

  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:var(--sh1)}
  .card-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
  .card-h .t{font-family:var(--font-d);font-weight:700;font-size:clamp(15px,0.94rem+0.2vw,17px);line-height:1.4}
  .card-h .count{font-family:var(--font-m);font-size:12px;color:var(--muted)}

  /* 月历 */
  .cal-nav{display:flex;align-items:center;gap:4px}
  .cal-nav button{background:none;border:1px solid var(--line);border-radius:9px;min-width:31px;height:31px;font-size:15px;color:var(--muted);transition:background .12s}
  .cal-nav button:hover{background:var(--surface-2);color:var(--ink)}
  .cal-nav .mon{font-family:var(--font-d);font-weight:700;font-size:15px;min-width:96px;text-align:center}
  .week{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
  .week span{text-align:center;font-family:var(--font-m);font-size:11px;color:var(--faint);padding:8px 0;letter-spacing:.01em}
  .days{display:grid;grid-template-columns:repeat(7,1fr)}
  .day{position:relative;background:none;border:none;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
    height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:background .12s}
  .day:nth-child(7n){border-right:none}
  .day .num{font-family:var(--font-m);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
  .day .dot{width:4px;height:4px;border-radius:50%;background:var(--accent)}
  .day .rdot{width:4px;height:4px;border-radius:50%;background:var(--muted)}
  .day.outside .num{color:var(--faint)}
  .day.today .num{color:var(--accent);font-weight:700}
  .day.selected{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
  .day:hover:not(.selected){background:var(--surface-2)}

  .right{display:flex;flex-direction:column;gap:16px}

  /* 速记 */
  .quick textarea{width:100%;min-height:92px;border:none;resize:vertical;background:transparent;color:var(--ink);
    font-family:var(--font-b);font-size:15px;line-height:1.7;padding:14px 18px 6px}
  .quick textarea::placeholder{color:var(--faint)}
  .hint{padding:0 18px 8px;font-size:12px;color:var(--faint);letter-spacing:.01em}
  .hint code{font-family:var(--font-m);background:var(--chip);color:var(--chip-ink);padding:1px 5px;border-radius:4px;font-size:11px}
  .quick-actions{display:flex;justify-content:flex-end;padding:0 18px 14px}

  /* 任务行 */
  .tasks{padding:6px 10px 10px}
  .empty{padding:28px 18px;text-align:center;color:var(--faint);font-size:13px;line-height:1.8}
  .task{border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:none}
  .trow{display:flex;align-items:center;gap:10px;padding:10px 8px;flex-wrap:wrap}
  .prog{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);
    font-family:var(--font-m);font-size:10px;color:var(--faint);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
  .prog.p25{color:var(--muted)}
  .prog.p50{border-color:var(--muted);color:var(--muted)}
  .prog.p75{border-color:var(--accent);color:var(--accent)}
  .prog.p100{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:12px}
  .tmain{flex:1;display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
  .ttitle{word-break:break-word;min-width:0;font-weight:500}
  .ttitle.done{color:var(--done);text-decoration:line-through}
  .meta{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .time{font-family:var(--font-m);font-size:12px;color:var(--muted);background:transparent;border:1px solid var(--line);
    border-radius:8px;padding:3px 5px;width:82px;font-variant-numeric:tabular-nums}
  .datepick{width:132px}
  .chip{font-family:var(--font-m);font-size:11px;background:var(--chip);color:var(--chip-ink);padding:2px 7px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .chip.fuzzy{border:1px dashed var(--line-strong);background:transparent}
  .expand,.del{flex:0 0 auto;background:none;border:none;color:var(--faint);font-size:15px;width:26px;height:26px;border-radius:8px}
  .expand:hover{background:var(--surface-2);color:var(--ink)}
  .del:hover{color:var(--accent);background:var(--surface-2)}

  .subs{margin:0 10px 12px 48px;display:flex;flex-direction:column;gap:6px}
  .sub{display:flex;align-items:center;gap:8px}
  .subcheck{flex:0 0 auto;width:16px;height:16px;border-radius:5px;border:2px solid var(--line-strong);background:none;position:relative}
  .subcheck.on{background:var(--accent);border-color:var(--accent)}
  .subcheck.on::after{content:"";position:absolute;left:4px;top:0;width:3px;height:7px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .stitle{flex:1;font-size:13px;color:var(--muted);word-break:break-word;min-width:0}
  .stitle.done{color:var(--done);text-decoration:line-through}
  .subdel{flex:0 0 auto;background:none;border:none;color:var(--faint);font-size:13px;width:22px;height:22px;border-radius:5px}
  .subdel:hover{color:var(--accent);background:var(--surface-2)}
  .subadd{width:100%;border:1px dashed var(--line-strong);border-radius:8px;background:transparent;color:var(--ink);font-family:var(--font-b);font-size:13px;padding:7px 10px}
  .subadd::placeholder{color:var(--faint)}

  /* 复盘 */
  .review textarea{width:100%;border:none;resize:vertical;background:transparent;color:var(--ink);
    font-family:var(--font-b);font-size:15px;line-height:1.7;padding:13px 18px 4px}
  .review textarea::placeholder{color:var(--faint)}
  .review .lbl{font-size:11px;color:var(--faint);font-family:var(--font-m);letter-spacing:.02em;padding:8px 18px 0}
  .review .divider{border-top:1px dashed var(--line);margin:8px 18px 0}
  .journal textarea{width:100%;border:none;resize:vertical;background:transparent;color:var(--ink);
    font-family:var(--font-b);font-size:15px;line-height:1.7;padding:13px 18px 6px;min-height:64px}
  .journal textarea::placeholder{color:var(--faint)}

  /* 改进追踪 */
  .tracker{display:flex;flex-direction:column;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .tracker:last-child{border-bottom:none}
  .tracker .trow2{display:flex;align-items:center;gap:10px}
  .tracker .ttext{flex:1;min-width:0;word-break:break-word}
  .tracker .tday{font-family:var(--font-m);font-size:11px;color:var(--faint);margin-top:2px}
  .tracker .mini{font-size:12px;padding:4px 10px;border-radius:9px}
  .tracker .mini.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .tracker .reason{display:flex;flex-direction:column;gap:6px;margin-top:4px}
  .tracker .reason input{font-family:var(--font-b);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink)}
  .tracker .reason .row{display:flex;gap:6px}

  /* 弹窗 */
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal[hidden]{display:none}
  .modal-backdrop{position:absolute;inset:0;background:rgba(20,18,14,.5);backdrop-filter:blur(2px)}
  .modal-card{position:relative;background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;
    width:100%;max-width:540px;max-height:84vh;display:flex;flex-direction:column;box-shadow:var(--sh2)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);
    font-family:var(--font-d);font-weight:700;font-size:17px;line-height:1.4}
  .modal-head .x{background:none;border:none;font-size:20px;color:var(--muted);width:30px;height:30px;border-radius:8px}
  .modal-head .x:hover{background:var(--surface-2);color:var(--ink)}
  .modal-body{padding:10px 20px;overflow:auto}
  .modal-foot{padding:12px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);min-height:20px}
  .modal-foot.actions{display:flex;justify-content:flex-end;gap:8px}
  .sync-field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
  .sync-field label{font-size:12px;color:var(--muted)}
  .sync-field input{font-family:var(--font-m);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--ink)}
  .sync-field input:focus{outline:2px solid var(--accent);outline-offset:1px}
  #sync-status{font-size:12px;color:var(--muted);min-height:16px;margin-top:4px}
  .sync-note{font-size:12px;color:var(--faint);line-height:1.6;margin:2px 0}
  .agenda{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .agenda:last-child{border-bottom:none}
  .ag-time{flex:0 0 auto;font-family:var(--font-m);font-size:12px;color:var(--accent);padding-top:2px;font-variant-numeric:tabular-nums;min-width:38px}
  .ag-main{flex:1;min-width:0}
  .ag-title{font-weight:600}
  .ag-title.done{color:var(--done);text-decoration:line-through}
  .ag-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .ag-subs{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
  .ag-subs li{margin:2px 0}
  .ag-subs li.done{text-decoration:line-through;color:var(--done)}

  /* 报告 */
  .rep-range{display:flex;gap:8px;align-items:center;margin:14px 0}
  .rep-range input{font-family:var(--font-m);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 9px;color:var(--ink)}
  .rep-presets{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
  .rep-presets .btn{font-size:12px;padding:5px 11px;border-radius:9px}
  .rep-out{white-space:pre-wrap;font-size:13px;line-height:1.8;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-height:46vh;overflow:auto;margin-top:12px;min-height:60px;color:var(--ink)}
  .rep-out:empty::before{content:"生成后这里显示报告内容";color:var(--faint)}
  .rep-img-wrap{margin-top:12px;text-align:center}
  .rep-img-wrap img{max-width:100%;border-radius:12px;box-shadow:var(--sh1)}
  .rep-img-wrap .dl{margin-top:8px}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);
    font-size:13px;padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;box-shadow:var(--sh2)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<header>
  <div class="brand"><h1>工作台</h1><span class="tag">速记 · 日历 · 复盘 · 报告</span></div>
  <div class="head-right">
    <span class="today-label">今日 <b id="header-today"></b></span>
    <button class="btn" id="btn-report">报告</button>
    <button class="btn" id="btn-backup" title="导出数据到文件">备份</button>
    <button class="btn" id="btn-import" title="从备份文件恢复">导入</button>
    <input type="file" id="import-file" accept="application/json" hidden>
    <button class="btn" id="btn-sync" title="云同步设置">同步</button>
    <button class="btn btn-accent" id="btn-tomorrow">明日待办</button>
  </div>
</header>

<main class="app">
  <section class="card">
    <div class="card-h">
      <span class="t" id="cal-title"></span>
      <div class="cal-nav">
        <button id="cal-prev" aria-label="上个月">‹</button>
        <button id="cal-today" title="回到今天">今</button>
        <button id="cal-next" aria-label="下个月">›</button>
      </div>
    </div>
    <div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="days" id="cal-grid"></div>
  </section>

  <div class="right">
    <section class="card quick">
      <div class="card-h"><span class="t">速记</span></div>
      <textarea id="quick" placeholder="每行一条任务，可写未来时间，例如：&#10;后天下午3点 开会&#10;这个月留2小时 做工程力学复习&#10;11月20日 15:00 交方案书，完成80%"></textarea>
      <div class="hint">支持：<code>今天/明天/后天</code> <code>下周三</code> <code>这个月/下周</code> <code>9点</code> <code>2小时</code> <code>完成80%</code>。回车添加。</div>
      <div class="quick-actions"><button class="btn" id="add">＋ 添加任务</button></div>
    </section>

    <section class="card">
      <div class="card-h"><span class="t" id="panel-date"></span><span class="count" id="day-count"></span></div>
      <div class="tasks" id="tasks"></div>
    </section>

    <section class="card review">
      <div class="card-h"><span class="t">复盘</span><span class="count" id="review-date"></span></div>
      <textarea id="review-text" placeholder="今天做了什么、状态怎么样…&#10;&#10;最后另起一行写「改进建议：」，下面按 1. 2. 编号写，每条会自动进入「改进追踪」"></textarea>
    </section>

    <section class="card journal">
      <div class="card-h"><span class="t">感恩银行</span><span class="count" id="ganen-date"></span></div>
      <textarea id="xqx-text" placeholder="今天的小确幸，记一件存进来…"></textarea>
    </section>

    <section class="card journal">
      <div class="card-h"><span class="t">浪前</span><span class="count" id="langqian-date"></span></div>
      <textarea id="langqian-text" placeholder="写这里…"></textarea>
    </section>

    <section class="card">
      <div class="card-h"><span class="t">改进追踪</span><span class="count" id="tracker-count"></span></div>
      <div class="tasks" id="trackers"></div>
    </section>

    <section class="card">
      <div class="card-h"><span class="t">待排期</span><span class="count" id="pool-count"></span></div>
      <div class="tasks" id="pool"></div>
    </section>
  </div>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card">
    <div class="modal-head"><span id="m-title"></span><button class="x" data-close>×</button></div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-foot" id="m-foot"></div>
  </div>
</div>
<div class="modal" id="sync-modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card">
    <div class="modal-head"><span>云同步</span><button class="x" data-close>×</button></div>
    <div class="modal-body">
      <div class="sync-field">
        <label>GitHub 令牌（Fine-grained PAT）</label>
        <input id="sync-token" type="password" placeholder="ghp_… 或 github_pat_…">
      </div>
      <div class="sync-note">令牌需勾选 Gist 的读写权限。首次连接会自动创建一个私密 Gist 存数据。</div>
      <div id="sync-status"></div>
    </div>
    <div class="modal-foot actions">
      <button class="btn" id="sync-disconnect">断开</button>
      <button class="btn btn-accent" id="sync-connect">连接</button>
    </div>
  </div>
</div>
<div class="modal" id="report-modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card">
    <div class="modal-head"><span>生成报告</span><button class="x" data-close>×</button></div>
    <div class="modal-body">
      <div class="rep-presets">
        <button class="btn" data-range="day">日报</button>
        <button class="btn" data-range="week">本周</button>
        <button class="btn" data-range="month">本月</button>
      </div>
      <div class="rep-range">
        <input type="date" id="rep-start"> <span style="color:var(--faint)">至</span> <input type="date" id="rep-end">
      </div>
      <div class="modal-foot actions" style="border:none;padding:0">
        <button class="btn btn-accent" id="rep-gen">生成</button>
      </div>
      <div class="rep-out" id="rep-out"></div>
      <div class="modal-foot actions" id="rep-actions" style="border:none;padding:12px 0 0">
        <button class="btn" id="rep-copy">复制文字</button>
        <button class="btn" id="rep-image">生成长图</button>
      </div>
      <div class="rep-img-wrap" id="rep-img-wrap" hidden></div>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
  const KEY='workbench.v3';
  const CLOUD_KEY='workbench.cloud';
  const WD=['日','一','二','三','四','五','六'];
  const WDN={一:1,二:2,三:3,四:4,五:5,六:6,日:0,天:0};
  const PROG=['0','25','50','75','100'];
  const $=s=>document.querySelector(s);
  const expanded=new Set();
  let data={tasks:[],reviews:{},trackers:[]};
  let viewMonth=new Date(); viewMonth.setDate(1);
  let selected=todayStr();

  function norm(d){ const o=(d&&typeof d==='object')?d:{}; return {tasks:Array.isArray(o.tasks)?o.tasks:[],reviews:(o.reviews&&typeof o.reviews==='object')?o.reviews:{},trackers:Array.isArray(o.trackers)?o.trackers:[],updatedAt:(typeof o.updatedAt==='number')?o.updatedAt:0}; }
  function loadLocal(){ try{ return norm(JSON.parse(localStorage.getItem(KEY))); }catch(e){ return {tasks:[],reviews:{},trackers:[]}; } }
  function getCloud(){ try{ return JSON.parse(localStorage.getItem(CLOUD_KEY))||null; }catch(e){ return null; } }
  function setCloud(c){ try{ if(c) localStorage.setItem(CLOUD_KEY,JSON.stringify(c)); else localStorage.removeItem(CLOUD_KEY); }catch(e){} }
  function save(){ data.updatedAt=Date.now(); try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} scheduleCloudPush(); }
  function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function parse(s){ const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
  function todayStr(){ return fmt(new Date()); }
  function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return fmt(d); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function byTime(a,b){ const ta=a.time||'99:99', tb=b.time||'99:99'; return ta.localeCompare(tb); }
  function tasksOn(date){ return data.tasks.filter(t=>t.date===date).sort(byTime); }
  function pool(){ return data.tasks.filter(t=>t.date===''); }
  function taskById(id){ return data.tasks.find(t=>t.id===id); }
  function syncMonth(){ const d=parse(selected); viewMonth=new Date(d.getFullYear(),d.getMonth(),1); }
  function activeTrackers(){ const today=todayStr(); const min=addDays(today,-6); return data.trackers.filter(t=>t.status!=='done'&&t.since>=min); }

  function resolveYear(mo,da){
    const now=new Date(); let d=new Date(now.getFullYear(),mo-1,da);
    if(d<new Date(now.getFullYear(),now.getMonth(),now.getDate())) d=new Date(now.getFullYear()+1,mo-1,da);
    return d;
  }

  function extractClock(s){
    let m=s.match(/(上午|下午|晚上|早上|中午|凌晨)\s*(\d{1,2})\s*[:：点]\s*(\d{1,2})?\s*分?/);
    if(m){ let h=+m[2]; const am=m[1];
      if(am==='下午'||am==='晚上'){ if(h<12) h+=12; }
      else if(am==='中午'){ if(h<11) h+=12; }
      else if(am==='上午'||am==='早上'){ if(h===12) h=0; }
      const min=m[3]?String(m[3]).padStart(2,'0'):'00';
      return {time:String(h).padStart(2,'0')+':'+min, rest:s.replace(m[0],'')};
    }
    m=s.match(/(\d{1,2})\s*[:：]\s*(\d{2})/);
    if(m && +m[1]<=23) return {time:String(+m[1]).padStart(2,'0')+':'+m[2], rest:s.replace(m[0],'')};
    m=s.match(/(\d{1,2})\s*点\s*(半|(\d{1,2})\s*分?)?/);
    if(m && +m[1]<=23){ const min=m[2]==='半'?'30':(m[3]?String(m[3]).padStart(2,'0'):'00');
      return {time:String(+m[1]).padStart(2,'0')+':'+min, rest:s.replace(m[0],'')}; }
    return {time:'',rest:s};
  }

  function cnToNum(s){
    if(/^\d+$/.test(s)) return +s;
    if(s==='十') return 10;
    const m={零:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
    if(s.length===1) return (s in m)?m[s]:NaN;
    if(s.length===2){
      if(s[0]==='十') return 10+(m[s[1]]||0);
      if(s[1]==='十') return (m[s[0]]||0)*10;
    }
    return NaN;
  }
  function thisWeekday(wd){
    const now=new Date();
    const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    let diff=(wd-now.getDay()+7)%7; d.setDate(d.getDate()+diff);
    if(d<today) d.setDate(d.getDate()+7);
    return d;
  }
  function monthEnd(off){ const now=new Date(); return new Date(now.getFullYear(),now.getMonth()+1+off,0); }

  function extractDate(s){
    let m=s.match(/(\d{4})\s*[年\-/]\s*(\d{1,2})\s*[月\-/]\s*(\d{1,2})\s*[日号]?/);
    if(m){ const d=new Date(+m[1],+m[2]-1,+m[3]); return {date:fmt(d),fuzzy:'',rest:s.replace(m[0],'')}; }
    m=s.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]/);
    if(m && +m[1]>=1 && +m[1]<=12 && +m[2]>=1 && +m[2]<=31){ const d=resolveYear(+m[1],+m[2]); return {date:fmt(d),fuzzy:'',rest:s.replace(m[0],'')}; }
    m=s.match(/(\d{1,2})\s*[-/]\s*(\d{1,2})/);
    if(m && +m[1]>=1 && +m[1]<=12 && +m[2]>=1 && +m[2]<=31){ const d=resolveYear(+m[1],+m[2]); return {date:fmt(d),fuzzy:'',rest:s.replace(m[0],'')}; }
    m=s.match(/([0-9]+|[一二两三四五六七八九十]+)\s*天\s*[后内]/);
    if(m){ const n=cnToNum(m[1]); if(isFinite(n)){ const d=new Date(); d.setDate(d.getDate()+n); return {date:fmt(d),fuzzy:'',rest:s.replace(m[0],'')}; } }
    if(/大后天/.test(s)) return {date:addDays(todayStr(),3),fuzzy:'',rest:s.replace(/大后天/,'')};
    if(/后天/.test(s)) return {date:addDays(todayStr(),2),fuzzy:'',rest:s.replace(/后天/,'')};
    if(/前天/.test(s)) return {date:addDays(todayStr(),-2),fuzzy:'',rest:s.replace(/前天/,'')};
    if(/昨天|昨日/.test(s)) return {date:addDays(todayStr(),-1),fuzzy:'',rest:s.replace(/昨天|昨日/,'')};
    if(/明天|明日/.test(s)) return {date:addDays(todayStr(),1),fuzzy:'',rest:s.replace(/明天|明日/,'')};
    if(/今天|今日/.test(s)) return {date:todayStr(),fuzzy:'',rest:s.replace(/今天|今日/,'')};
    m=s.match(/(下下|下|这|本)\s*个?\s*周末/);
    if(m){ let base=thisWeekday(6); if(m[1]==='下') base=addDays(fmt(base),7); if(m[1]==='下下') base=addDays(fmt(base),14); return {date:fmt(base),fuzzy:'',rest:s.replace(m[0],'')}; }
    if(/周末/.test(s)) return {date:fmt(thisWeekday(6)),fuzzy:'',rest:s.replace(/周末/,'')};
    m=s.match(/(下下|下|这|本)\s*个?\s*月底(?:前|之前)?/);
    if(m){ let off=0; if(m[1]==='下') off=1; if(m[1]==='下下') off=2; return {date:fmt(monthEnd(off)),fuzzy:'',rest:s.replace(m[0],'')}; }
    m=s.match(/(?:月底|月末)(?:前|之前)?/);
    if(m) return {date:fmt(monthEnd(0)),fuzzy:'',rest:s.replace(m[0],'')};
    m=s.match(/(下下|下|这|本)?\s*周([一二三四五六日天])/);
    if(m){
      const today=new Date(); const curW=today.getDay(); let diff=WDN[m[2]]-curW;
      if(m[1]==='下下') diff+=14; else if(m[1]==='下') diff+=7;
      else if(m[1]==='这'||m[1]==='本'){ if(diff<0) diff+=7; }
      else { if(diff<0) diff+=7; if(diff===0) diff=7; }
      const d=new Date(); d.setDate(d.getDate()+diff);
      return {date:fmt(d),fuzzy:'',rest:s.replace(m[0],'')};
    }
    m=s.match(/这\s*([一二两三四五六七八九十0-9]+)\s*天/);
    if(m) return {date:'',fuzzy:'这'+m[1]+'天',rest:s.replace(m[0],'')};
    if(/最近几天|这几天/.test(s)) return {date:'',fuzzy:'这几天',rest:s.replace(/最近几天|这几天/,'')};
    m=s.match(/(下下|下|这|本)\s*周(?:内)?/);
    if(m) return {date:'',fuzzy:m[0],rest:s.replace(m[0],'')};
    m=s.match(/(下|这|本)\s*个?\s*月(?:内)?/);
    if(m) return {date:'',fuzzy:m[0],rest:s.replace(m[0],'')};
    m=s.match(/(最近|近期|尽快|改天|有空|抽空)/);
    if(m) return {date:'',fuzzy:m[1],rest:s.replace(m[1],'')};
    m=s.match(/(这个学期|这学期|下学期|寒假|暑假|这个假期|这假期)/);
    if(m) return {date:'',fuzzy:m[1],rest:s.replace(m[1],'')};
    return {date:'',fuzzy:'',rest:s};
  }

  function extractProgress(s){
    let m=s.match(/(?:已)?完成\s*(\d{1,3})\s*%/);
    if(m) return {progress:m[1], rest:s.replace(m[0],'')};
    m=s.match(/(\d{1,3})\s*%\s*(?:完成)?/);
    if(m) return {progress:m[1], rest:s.replace(m[0],'')};
    return {progress:'', rest:s};
  }

  function extractDuration(s){
    let m=s.match(/(?:要花|需要|打算|计划|抽出|起码|至少|大概|大约|得|留|花|抽|用|要)?\s*([0-9]+|[一二两三四五六七八九十]+)\s*天/);
    if(m) return {dur:m[1]+'天', rest:s.replace(m[0],'')};
    if(/半天/.test(s)) return {dur:'半天', rest:s.replace(/半天/,'')};
    if(/一整天|整天/.test(s)) return {dur:'1天', rest:s.replace(/一整天|整天/,'')};
    if(/半小时/.test(s)) return {dur:'半小时', rest:s.replace(/半小时/,'')};
    m=s.match(/(?:要花|需要|打算|计划|抽出|起码|至少|大概|大约|得|留|花|抽|用|要)?\s*([0-9]+(?:\.[0-9]+)?|[一二两三四五六七八九十]+)\s*(?:个?\s*小时|小时|钟头|h)(?![a-zA-Z])/i);
    if(m) return {dur:m[1]+'小时', rest:s.replace(m[0],'')};
    m=s.match(/(?:起码|至少|大概|大约)?\s*([0-9]+|[一二两三四五六七八九十]+)\s*(?:分钟|min)/i);
    if(m) return {dur:m[1]+'分钟', rest:s.replace(m[0],'')};
    m=s.match(/([0-9]+|[一二两三四五六七八九十]+)\s*(?:个?\s*星期|周)/);
    if(m) return {dur:m[1]+'周', rest:s.replace(m[0],'')};
    m=s.match(/([0-9]+|[一二两三四五六七八九十]+)\s*个?\s*月/);
    if(m) return {dur:m[1]+'个月', rest:s.replace(m[0],'')};
    return {dur:'', rest:s};
  }

  function parseLine(raw){
    let s=raw.trim(); if(!s) return null;
    const pr=extractProgress(s); let progress=pr.progress; s=pr.rest;
    const dt=extractDate(s); let date=dt.date, fuzzy=dt.fuzzy; s=dt.rest;
    const du=extractDuration(s); let dur=du.dur; s=du.rest;
    const cl=extractClock(s); let time=cl.time; s=cl.rest;

    let title=s.replace(/^[\s,，。、；;：:]+/,'').replace(/[\s,，。、；;：:]+$/,'');
    title=title.replace(/^(?:得|去|要)(?=[做弄完搞结学写交发查复习准备整理安排按处领来])/,'');
    const STOPS=['需要','打算','计划','记得','争取','尽量','起码','至少','大概','大约','抽出','弄完','做完','完成','搞定','结束','要花'];
    for(let i=0;i<4;i++){ let changed=false; for(const w of STOPS){ const re=new RegExp('^'+w+'\\s*'); const n=title.replace(re,''); if(n!==title){ title=n; changed=true; break; } } if(!changed) break; }
    title=title.replace(/^[\s,，。、；;：:]+/,'').replace(/[\s,，。、；;：:]+$/,'');
    if(!title) return null;
    return {title:title, date:date, time:time, dur:dur, progress:progress, fuzzy:fuzzy};
  }

  function render(){
    $('#header-today').textContent=(new Date().getMonth()+1)+'月'+new Date().getDate()+'日 星期'+WD[new Date().getDay()];
    renderCalendar(); renderPanel(); renderPool(); renderReview(); renderTrackers();
  }
  function renderCalendar(){
    const y=viewMonth.getFullYear(), m=viewMonth.getMonth();
    $('#cal-title').textContent=y+'年'+(m+1)+'月';
    const first=new Date(y,m,1); const offset=(first.getDay()+6)%7; const start=new Date(y,m,1-offset);
    const grid=$('#cal-grid'); grid.innerHTML=''; const today=todayStr();
    for(let i=0;i<42;i++){
      const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
      const ds=fmt(d);
      const cell=document.createElement('button'); cell.className='day';
      if(d.getMonth()!==m) cell.classList.add('outside');
      if(ds===today) cell.classList.add('today');
      if(ds===selected) cell.classList.add('selected');
      const has=tasksOn(ds).length>0;
      const hasR=!!(data.reviews[ds]&&data.reviews[ds].text&&data.reviews[ds].text.trim());
      cell.innerHTML='<span class="num">'+d.getDate()+'</span>'+(has?'<span class="dot"></span>':'')+(hasR?'<span class="rdot"></span>':'');
      cell.addEventListener('click',()=>{ selected=ds; if(d.getMonth()!==m) viewMonth=new Date(d.getFullYear(),d.getMonth(),1); render(); });
      grid.appendChild(cell);
    }
  }
  function renderPanel(){
    const d=parse(selected);
    const pre=selected===todayStr()?'今天':(selected===addDays(todayStr(),1)?'明天':'');
    $('#panel-date').textContent=(pre?pre+' · ':'')+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WD[d.getDay()];
    const tasks=tasksOn(selected); const doneN=tasks.filter(t=>t.progress==='100').length;
    $('#day-count').textContent=doneN+'/'+tasks.length;
    $('#tasks').innerHTML=tasks.length?tasks.map(taskHTML).join('')
      :'<div class="empty">这天还没有任务。<br>在「速记」写一条，或把「待排期」里的任务排到这天。</div>';
  }
  function renderPool(){
    const p=pool(); $('#pool-count').textContent=String(p.length);
    $('#pool').innerHTML=p.length?p.map(poolHTML).join('')
      :'<div class="empty">没有待排期的任务。<br>速记里写「这个月 / 下周」这类模糊时间，会进到这里，再点日期排到具体某天。</div>';
  }
  function progInfo(t){
    const c=t.progress==='100'?'p100':(t.progress==='75'?'p75':(t.progress==='50'?'p50':(t.progress==='25'?'p25':'')));
    const label=t.progress==='100'?'✓':(t.progress||'0');
    return {c:c,label:label};
  }
  function taskHTML(t){
    const pi=progInfo(t);
    const subN=(t.subs&&t.subs.length)?'<span class="chip">'+t.subs.length+'点</span>':'';
    let subHtml='';
    if(expanded.has(t.id)){
      subHtml='<div class="subs">';
      (t.subs||[]).forEach((s,i)=>{ subHtml+='<div class="sub"><button class="subcheck '+(s.done?'on':'')+'" data-act="subtoggle" data-i="'+i+'"></button><span class="stitle'+(s.done?' done':'')+'">'+esc(s.t)+'</span><button class="subdel" data-act="subdel" data-i="'+i+'">×</button></div>'; });
      subHtml+='<input class="subadd" placeholder="拆解子任务，回车添加">';
      subHtml+='</div>';
    }
    return '<div class="task" data-id="'+t.id+'">'+
      '<div class="trow">'+
        '<button class="prog '+pi.c+'" data-act="prog" title="完成度，点击切换">'+pi.label+'</button>'+
        '<span class="tmain"><span class="ttitle'+(t.progress==='100'?' done':'')+'">'+esc(t.title)+'</span>'+subN+'</span>'+
        '<span class="meta"><input class="time" type="time" value="'+esc(t.time||'')+'" data-act="time" title="时间">'+(t.dur?'<span class="chip">'+esc(t.dur)+'</span>':'')+'</span>'+
        '<button class="expand" data-act="expand" title="拆解">'+(expanded.has(t.id)?'−':'＋')+'</button>'+
        '<button class="del" data-act="del" title="删除">×</button>'+
      '</div>'+subHtml+'</div>';
  }
  function poolHTML(t){
    const pi=progInfo(t);
    return '<div class="task" data-id="'+t.id+'">'+
      '<div class="trow">'+
        '<button class="prog '+pi.c+'" data-act="prog" title="完成度">'+pi.label+'</button>'+
        '<span class="tmain"><span class="ttitle">'+esc(t.title)+'</span>'+
          (t.fuzzy?'<span class="chip fuzzy">'+esc(t.fuzzy)+'</span>':'')+
          (t.dur?'<span class="chip">'+esc(t.dur)+'</span>':'')+
        '</span>'+
        '<input class="time datepick" type="date" data-act="schedule" title="排到某天">'+
        '<button class="del" data-act="del" title="删除">×</button>'+
      '</div></div>';
  }

  function renderReview(){
    const d=parse(selected);
    const md=(d.getMonth()+1)+'月'+d.getDate()+'日';
    $('#review-date').textContent=md;
    $('#ganen-date').textContent=md;
    $('#langqian-date').textContent=md;
    const r=data.reviews[selected]||{text:'',improvements:[]};
    $('#review-text').value=r.text||'';
    $('#xqx-text').value=r.xqx||'';
    $('#langqian-text').value=r.langqian||'';
  }
  function parseImprovements(text){
    const out=[]; let inImp=false;
    for(let raw of String(text||'').split('\n')){
      const line=raw.trim();
      if(/^改进建议\s*[:：]?\s*$/.test(line)){ inImp=true; continue; }
      if(!inImp||!line) continue;
      const t=line.replace(/^(?:[(（]?\s*\d{1,2}\s*[)）]\s*|\d{1,2}\s*[.、．:：]\s*)/,'').trim();
      if(t&&!/^改进建议\s*[:：]?$/.test(t)) out.push(t);
    }
    return out;
  }
  function syncTrackers(improvements,since){
    const imp=improvements||[]; let changed=false;
    for(let i=data.trackers.length-1;i>=0;i--){
      const t=data.trackers[i];
      if(t.since===since&&t.status!=='done'&&!imp.includes(t.text)){ data.trackers.splice(i,1); changed=true; }
    }
    imp.forEach(text=>{
      if(!data.trackers.some(t=>t.text===text)){
        data.trackers.push({id:uid(),text:text,since:since,status:'active'}); changed=true;
      }
    });
    return changed;
  }
  function saveReview(){
    const r=data.reviews[selected]||(data.reviews[selected]={text:'',improvements:[]});
    r.text=$('#review-text').value;
    r.xqx=$('#xqx-text').value;
    r.langqian=$('#langqian-text').value;
    r.improvements=parseImprovements(r.text);
    syncTrackers(r.improvements,selected);
    save(); renderCalendar(); renderTrackers();
  }
  function renderTrackers(){
    const list=activeTrackers();
    $('#tracker-count').textContent=String(list.length);
    $('#trackers').innerHTML=list.length?list.map(trackerHTML).join('')
      :'<div class="empty">暂无改进追踪。<br>在「复盘」里写「改进建议」，会在这里追踪 7 天。</div>';
  }
  function trackerHTML(t){
    const days=Math.max(0, Math.round((parse(addDays(t.since,6))-parse(todayStr()))/86400000)+1);
    return '<div class="tracker" data-id="'+t.id+'">'+
      '<div class="trow2">'+
        '<span class="ttext">'+esc(t.text)+'</span>'+
        '<button class="btn mini ok" data-act="achieve">达到</button>'+
        '<button class="btn mini" data-act="notachieve">未达到</button>'+
      '</div>'+
      '<div class="tday">剩余 '+days+' 天</div>'+
      '<div class="reason" hidden></div>'+
    '</div>';
  }

  function onTrackerClick(e){
    const b=e.target.closest('[data-act]'); if(!b) return;
    const row=b.closest('.tracker'); const t=data.trackers.find(x=>x.id===row.dataset.id); if(!t) return;
    if(b.dataset.act==='achieve'){ t.status='done'; save(); renderTrackers(); toast('已标记达到'); }
    else if(b.dataset.act==='notachieve'){
      const box=row.querySelector('.reason');
      box.hidden=false;
      box.innerHTML='<input class="r-reason" placeholder="原因（为什么没做到）">'+
        '<div class="row"><input class="r-new" placeholder="新的改进建议（不写则 7 天后消失）"><button class="btn btn-accent" data-act="submit" style="font-size:12px;padding:5px 11px">提交</button></div>';
    }
    else if(b.dataset.act==='submit'){
      const newText=row.querySelector('.r-new').value.trim();
      if(newText){ t.text=newText; t.since=todayStr(); }
      else { t.status='done'; }
      save(); renderTrackers(); toast(newText?'已更新，继续追踪 7 天':'已结束追踪');
    }
  }
  $('#trackers').addEventListener('click',onTrackerClick);

  function onTaskClick(e){
    const b=e.target.closest('[data-act]'); if(!b) return;
    const row=b.closest('.task'); const t=taskById(row.dataset.id); if(!t) return;
    const act=b.dataset.act;
    if(act==='prog'){
      const i=PROG.indexOf(t.progress||'0'); t.progress=PROG[(i+1)%PROG.length]; if(t.progress==='0') t.progress='';
      save(); render();
    }else if(act==='expand'){
      expanded.has(t.id)?expanded.delete(t.id):expanded.add(t.id); render();
    }else if(act==='subtoggle'){
      const s=t.subs[+b.dataset.i]; s.done=!s.done; save(); render();
    }else if(act==='subdel'){
      t.subs.splice(+b.dataset.i,1); save(); render();
    }else if(act==='del'){
      data.tasks.splice(data.tasks.indexOf(t),1); save(); render();
    }
  }
  function onTimeChange(e){
    const inp=e.target.closest('input.time'); if(!inp) return;
    const t=taskById(inp.closest('.task').dataset.id); if(!t) return;
    t.time=inp.value; save(); render();
  }
  function onPoolChange(e){
    const inp=e.target.closest('input[data-act="schedule"]'); if(!inp) return;
    const t=taskById(inp.closest('.task').dataset.id); if(!t) return;
    if(inp.value){ t.date=inp.value; t.fuzzy=''; } save(); render();
  }
  function onSubKeydown(e){
    if(e.key!=='Enter') return;
    const inp=e.target.closest('.subadd'); if(!inp) return;
    const t=taskById(inp.closest('.task').dataset.id); if(!t) return;
    const v=inp.value.trim(); if(!v) return;
    (t.subs=t.subs||[]).push({t:v,done:false}); save(); render();
  }

  $('#tasks').addEventListener('click',onTaskClick);
  $('#pool').addEventListener('click',onTaskClick);
  $('#tasks').addEventListener('change',onTimeChange);
  $('#pool').addEventListener('change',onPoolChange);
  $('#tasks').addEventListener('keydown',onSubKeydown);

  let rt;
  $('#review-text').addEventListener('input',()=>{ clearTimeout(rt); rt=setTimeout(saveReview,500); });
  $('#xqx-text').addEventListener('input',()=>{ clearTimeout(rt); rt=setTimeout(saveReview,500); });
  $('#langqian-text').addEventListener('input',()=>{ clearTimeout(rt); rt=setTimeout(saveReview,500); });

  function addAll(){
    const v=$('#quick').value;
    const lines=v.split('\n').map(s=>s.trim()).filter(Boolean);
    let added=0;
    lines.forEach(l=>{ const t=parseLine(l); if(t){ t.id=uid(); t.subs=[]; t.progress=t.progress||''; data.tasks.push(t); added++; } });
    $('#quick').value='';
    if(added){ save(); render(); toast('已添加 '+added+' 条任务'); }
    else toast('没解析出任务，检查一下写法');
  }
  $('#add').onclick=addAll;
  $('#quick').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); addAll(); } });

  function renderTomorrow(){
    const tom=addDays(todayStr(),1); const d=parse(tom);
    $('#m-title').textContent='明日待办 · '+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+WD[d.getDay()];
    const tasks=tasksOn(tom); const body=$('#m-body'); body.innerHTML='';
    if(!tasks.length){ body.innerHTML='<div class="empty">明天暂无安排。</div>'; }
    else{
      tasks.forEach(t=>{
        const el=document.createElement('div'); el.className='agenda';
        let meta=(t.dur||t.progress)?('<div class="ag-meta">'+[t.dur, t.progress?'完成'+t.progress+'%':''].filter(Boolean).join(' · ')+'</div>'):'';
        let subs=(t.subs&&t.subs.length)?('<ul class="ag-subs">'+t.subs.map(s=>'<li class="'+(s.done?'done':'')+'">'+esc(s.t)+'</li>').join('')+'</ul>'):'';
        el.innerHTML='<div class="ag-time">'+(t.time||'未定')+'</div><div class="ag-main"><div class="ag-title'+(t.progress==='100'?' done':'')+'">'+esc(t.title)+'</div>'+meta+subs+'</div>';
        body.appendChild(el);
      });
    }
    const p=pool(); $('#m-foot').textContent=p.length?('还有 '+p.length+' 条待排期未安排到具体日期'):'';
    $('#modal').hidden=false;
  }
  function closeModal(){ $('#modal').hidden=true; }
  $('#btn-tomorrow').onclick=renderTomorrow;
  $('#modal').addEventListener('click',e=>{ if(e.target.closest('[data-close]')) closeModal(); });

  $('#cal-prev').onclick=()=>{ viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()-1,1); render(); };
  $('#cal-next').onclick=()=>{ viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth()+1,1); render(); };
  $('#cal-today').onclick=()=>{ selected=todayStr(); syncMonth(); render(); };

  let toastTimer;
  function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1800); }

  // 报告
  let reportText='';
  function repSetDates(s,e){ $('#rep-start').value=s; $('#rep-end').value=e; }
  $('#btn-report').onclick=()=>{
    const today=todayStr();
    const wd=new Date().getDay(); const weekStart=addDays(today,-(wd+6)%7);
    repSetDates(today,today);
    $('#report-modal').hidden=false;
  };
  document.querySelectorAll('.rep-presets .btn').forEach(b=>{
    b.onclick=()=>{
      const today=todayStr(); const wd=new Date().getDay();
      if(b.dataset.range==='day') repSetDates(today,today);
      if(b.dataset.range==='week') repSetDates(addDays(today,-(wd+6)%7),today);
      if(b.dataset.range==='month'){ const d=new Date(); repSetDates(fmt(new Date(d.getFullYear(),d.getMonth(),1)),today); }
    };
  });
  $('#report-modal').addEventListener('click',e=>{ if(e.target.closest('[data-close]')) $('#report-modal').hidden=true; });

  function genReport(){
    const s=$('#rep-start').value, e=$('#rep-end').value;
    if(!s||!e||s>e){ toast('请选好开始和截止日期'); return; }
    const lines=['📋 工作台报告  '+s+' ~ '+e,''];
    let d=s, has=false;
    while(d<=e){
      const r=data.reviews[d];
      if(r&&(r.text||'').trim()){
        has=true;
        const dd=parse(d);
        lines.push('▍'+(dd.getMonth()+1)+'月'+dd.getDate()+'日 星期'+WD[dd.getDay()]);
        lines.push(r.text.trim());
        if(r.improvements&&r.improvements.length) lines.push('改进建议：'+r.improvements.join('；'));
        if(r.xqx&&r.xqx.trim()) lines.push('小确幸：'+r.xqx.trim());
        if(r.langqian&&r.langqian.trim()) lines.push('浪前：'+r.langqian.trim());
        lines.push('');
      }
      d=addDays(d,1);
    }
    if(!has) lines.push('（这段时间还没有写复盘）');
    reportText=lines.join('\n');
    $('#rep-out').textContent=reportText;
  }
  $('#rep-gen').onclick=genReport;
  $('#rep-copy').onclick=async ()=>{
    if(!reportText){ toast('先生成报告'); return; }
    try{ await navigator.clipboard.writeText(reportText); toast('已复制'); }
    catch(e){ toast('复制失败，请手动选中复制'); }
  };
  $('#rep-image').onclick=()=>{ if(!reportText){ toast('先生成报告'); return; } drawReportImage(); };

  function drawReportImage(){
    const W=760, pad=46, lineH=30, titleH=60;
    const font='16px '+'"PingFang SC","Microsoft YaHei",sans-serif';
    const ctx=document.createElement('canvas').getContext('2d');
    ctx.font=font;
    // 计算高度
    const blocks=reportText.split('\n');
    let totalH=pad*2+titleH;
    blocks.forEach(ln=>{
      const wrapped=wrapText(ctx,ln,W-pad*2);
      totalH+=wrapped.length*lineH;
    });
    const canvas=document.createElement('canvas'); canvas.width=W; canvas.height=totalH;
    const c=canvas.getContext('2d');
    c.fillStyle=getComputedStyle(document.body).backgroundColor||'#F1EEE6';
    c.fillRect(0,0,W,totalH);
    c.fillStyle=getComputedStyle(document.body).color||'#232019';
    c.font='bold 22px '+'"PingFang SC","Microsoft YaHei",sans-serif';
    c.fillText('工作台报告',pad,pad+28);
    c.font=font;
    let y=pad+titleH;
    blocks.forEach(ln=>{
      wrapText(c,ln,W-pad*2).forEach(wl=>{ c.fillText(wl,pad,y); y+=lineH; });
    });
    const url=canvas.toDataURL('image/png');
    const wrap=$('#rep-img-wrap'); wrap.hidden=false;
    wrap.innerHTML='<img src="'+url+'"><div class="dl"><button class="btn" id="rep-dl">保存图片</button></div>';
    $('#rep-dl').onclick=()=>{ const a=document.createElement('a'); a.href=url; a.download='工作台报告.png'; a.click(); };
    toast('长图已生成');
  }
  function wrapText(ctx,text,maxW){
    const out=[]; let cur='';
    for(const ch of text){
      if(ctx.measureText(cur+ch).width>maxW){ out.push(cur); cur=ch; } else cur+=ch;
    }
    if(cur) out.push(cur);
    return out.length?out:[''];
  }

  function doBackup(){
    const d=new Date();
    const name='工作台备份-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
    const blob=new Blob([JSON.stringify({app:'工作台',tasks:data.tasks,reviews:data.reviews,trackers:data.trackers},null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast('已导出备份文件');
  }
  $('#btn-backup').onclick=doBackup;
  $('#btn-import').onclick=()=>$('#import-file').click();
  $('#import-file').addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(r.result);
        const arr=(o&&Array.isArray(o.tasks))?o.tasks:(Array.isArray(o)?o:null);
        if(!arr) throw new Error('bad');
        data={tasks:arr,reviews:(o&&o.reviews)||{},trackers:(o&&o.trackers)||[]};
        save(); render(); toast('已导入 '+arr.length+' 条任务');
      }catch(err){ toast('导入失败：不是有效的备份文件'); }
    };
    r.readAsText(f); e.target.value='';
  });

  if('serviceWorker' in navigator && (location.protocol==='http:'||location.protocol==='https:')){
    window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  }

  // GitHub 云同步
  const GH_API='https://api.github.com';
  const GIST_DESC='工作台数据';
  const GIST_FILE='workbench.json';
  let pushTimer;

  function ghHeaders(token){ return {'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}; }
  async function findGist(token){
    const r=await fetch(GH_API+'/gists?per_page=100',{headers:ghHeaders(token)});
    if(!r.ok) throw new Error('auth');
    const list=await r.json();
    return (Array.isArray(list)?list.find(g=>g.description===GIST_DESC):null)||null;
  }
  async function ensureGist(token){
    const g=await findGist(token);
    if(g) return g.id;
    const r=await fetch(GH_API+'/gists',{method:'POST',headers:ghHeaders(token),
      body:JSON.stringify({description:GIST_DESC,public:false,files:{[GIST_FILE]:{content:JSON.stringify({tasks:[],reviews:{},trackers:[]})}}})});
    const created=await r.json();
    if(!created||!created.id) throw new Error('create');
    return created.id;
  }
  async function readTasks(token,gistId){
    const r=await fetch(GH_API+'/gists/'+gistId,{headers:ghHeaders(token)});
    if(!r.ok) return norm({});
    const g=await r.json();
    const f=g.files&&g.files[GIST_FILE];
    if(!f) return norm({});
    try{ return norm(JSON.parse(f.content||'{}')); }catch(e){ return norm({}); }
  }
  async function writeTasks(token,gistId,payload){
    await fetch(GH_API+'/gists/'+gistId,{method:'PATCH',headers:ghHeaders(token),keepalive:true,
      body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(payload)}}})});
  }

  function scheduleCloudPush(){ const c=getCloud(); if(!c||!c.token||!c.gistId) return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>pushToCloud(c),600); }
  async function pushToCloud(c){
    try{ await writeTasks(c.token,c.gistId,{tasks:data.tasks,reviews:data.reviews,trackers:data.trackers,updatedAt:data.updatedAt}); setSyncText('已同步 '+new Date().toLocaleTimeString()); }
    catch(e){ setSyncText('同步失败，请检查网络'); }
  }
  function setSyncText(s){ const el=$('#sync-status'); if(el) el.textContent=s; }

  $('#btn-sync').onclick=()=>{ const c=getCloud(); $('#sync-token').value=c?c.token:''; setSyncText(''); $('#sync-modal').hidden=false; };
  $('#sync-modal').addEventListener('click',e=>{ if(e.target.closest('[data-close]')) $('#sync-modal').hidden=true; });
  $('#sync-connect').onclick=async ()=>{
    const token=$('#sync-token').value.trim();
    if(!token){ setSyncText('请粘贴 GitHub 令牌'); return; }
    setSyncText('连接中…');
    try{
      const gistId=await ensureGist(token);
      setCloud({token,gistId});
      data=pickData(loadLocal(), await readTasks(token,gistId));
      save(); render(); toast('已连接云同步');
      $('#sync-modal').hidden=true;
    }catch(e){
      setCloud(null);
      setSyncText('连接失败：令牌无效，或没勾选 Gist 读写权限');
    }
  };
  $('#sync-disconnect').onclick=()=>{ setCloud(null); $('#sync-modal').hidden=true; toast('已断开云同步'); };

  function pickData(local,cloud){
    const lu=local.updatedAt||0, cu=cloud.updatedAt||0;
    if(lu!==cu) return lu>cu?local:cloud;
    const size=d=>(d.tasks?d.tasks.length:0)+Object.keys(d.reviews||{}).length+(d.trackers?d.trackers.length:0);
    return size(cloud)>=size(local)?cloud:local;
  }
  function reconcileReviews(){
    let changed=false;
    for(const d in data.reviews){
      const r=data.reviews[d];
      if(!r||typeof r!=='object') continue;
      const imps=parseImprovements(r.text||'');
      r.improvements=imps;
      if(syncTrackers(imps,d)) changed=true;
    }
    return changed;
  }
  async function boot(){
    const c=getCloud();
    const local=loadLocal();
    data=local;
    let cloud=null;
    if(c&&c.token&&c.gistId){
      try{ cloud=await readTasks(c.token,c.gistId); }catch(e){}
    }
    if(cloud) data=pickData(local,cloud);
    const chosenLocal=cloud?(data===local):false;
    const changed=reconcileReviews();
    if(chosenLocal||changed) save();
    else { try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} }
    render();
  }
  window.addEventListener('pagehide',()=>{ const c=getCloud(); if(c&&c.token&&c.gistId){ clearTimeout(pushTimer); pushToCloud(c); } });
  boot();
</script>
